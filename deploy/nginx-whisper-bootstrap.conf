# Bootstrap Nginx configuration for WhisperAPI before the TLS certificate exists.
# Use this first on a fresh droplet, obtain the certificate with Certbot, then
# replace it with nginx-whisper.conf.

upstream whisper_app {
  server 127.0.0.1:9000;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name whisper.memorystory.org;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/health {
    proxy_pass http://whisper_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 200 'whisper bootstrap ready';
    add_header Content-Type text/plain;
  }
}