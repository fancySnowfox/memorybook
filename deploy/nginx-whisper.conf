# Nginx configuration for WhisperAPI on a dedicated DigitalOcean droplet
# Point whisper.memorystory.org DNS to this droplet, then place this file at:
# /etc/nginx/sites-available/whisper
# Enable it with:
# sudo ln -s /etc/nginx/sites-available/whisper /etc/nginx/sites-enabled/whisper

upstream whisper_app {
  # Default: Docker publishes the container port 9000 on localhost.
  server 127.0.0.1:9000;
  keepalive 64;
}

# HTTP to HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name whisper.memorystory.org;

  # Allow Let's Encrypt verification
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

# HTTPS server for WhisperAPI
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name whisper.memorystory.org;

  # These files are created by Certbot. Use nginx-whisper-bootstrap.conf first
  # on a fresh droplet, obtain the certificate, then enable this HTTPS config.
  ssl_certificate /etc/letsencrypt/live/whisper.memorystory.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/whisper.memorystory.org/privkey.pem;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  access_log /var/log/nginx/whisper_access.log combined;
  error_log /var/log/nginx/whisper_error.log warn;

  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 3600s;
  proxy_buffering off;
  client_max_body_size 1024M;

  # WhisperAPI requests typically include large uploads and long-running jobs.
  location / {
    proxy_pass http://whisper_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Optional health endpoint for smoke tests.
  location = /api/health {
    proxy_pass http://whisper_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}